name: Monthly Book Tracker

on:
  schedule:
    # 1st of the month, 06:00 UTC. GitHub may delay scheduled runs by a few
    # minutes to hours under load; that's fine for a monthly digest.
    - cron: "0 6 1 * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    # Exclude the paths this workflow itself commits to — without this, its
    # own "Update tracked books" commit would re-trigger itself in a loop.
    # Site/template/code pushes still redeploy immediately; only the
    # source-fetch cycle stays monthly/manual.
    paths-ignore:
      - "state.json"
      - "site/**"

permissions:
  contents: write   # to commit state.json + site/ back to the repo
  pages: write       # to deploy the static site
  id-token: write    # required by actions/deploy-pages

# Only one Pages deployment at a time; don't cancel an in-flight run just
# because a manual dispatch was also triggered.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Run tracking cycle
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
        run: python main.py

      - name: Commit updated state and site
        run: |
          git config user.name "physio-book-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json site
          git diff --cached --quiet || git commit -m "Update tracked books ($(date -u +%Y-%m-%d))"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Optional second deploy target: a clean pages.dev URL with no
      # personal username in it. No-ops (fails this one step only, doesn't
      # fail the job) until CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
      # secrets exist and a "physio-book-tracker" Pages project has been
      # created in the Cloudflare dashboard — see README.md.
      - name: Deploy to Cloudflare Pages
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=physio-book-tracker
