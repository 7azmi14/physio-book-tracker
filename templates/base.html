<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site_title }}{% endblock %}</title>
<link rel="alternate" type="application/rss+xml" title="{{ site_title }}" href="feed.xml">
<link rel="alternate" type="application/json" title="{{ site_title }}" href="feed.json">
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfaf8;
    --fg: #1c1c1a;
    --muted: #6b6b63;
    --accent: #2f6f4f;
    --accent-bg: #e9f3ec;
    --border: #e3e1da;
    --card-bg: #ffffff;
    --edition-bg: #fff6e0;
    --edition-border: #e8c468;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a;
      --fg: #eceae4;
      --muted: #a3a196;
      --accent: #6fcf97;
      --accent-bg: #1e2b23;
      --border: #33342f;
      --card-bg: #1f2022;
      --edition-bg: #2b2410;
      --edition-border: #7a5f1f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 17px/1.55 -apple-system, "Segoe UI", Georgia, "Iowan Old Style", serif;
  }
  a { color: var(--accent); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }
  header.site { border-bottom: 1px solid var(--border); margin-bottom: 1.5rem; padding-bottom: 1rem; }
  header.site h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  header.site .tagline { color: var(--muted); font-size: .95rem; }
  header.site nav { margin-top: .75rem; font-size: .9rem; }
  header.site nav a { margin-right: 1rem; }
  footer.site { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--border); color: var(--muted); font-size: .85rem; }
  h2.section { font-size: 1.1rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 2rem 0 .75rem; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.15rem;
    margin-bottom: .85rem;
  }
  .card.edition { background: var(--edition-bg); border-color: var(--edition-border); }
  .card h3 { margin: 0 0 .25rem; font-size: 1.08rem; line-height: 1.35; }
  .card h3 a { text-decoration: none; color: var(--fg); }
  .card h3 a:hover { text-decoration: underline; }
  .card .meta { color: var(--muted); font-size: .88rem; margin: .15rem 0; }
  .badge {
    display: inline-block;
    background: var(--accent-bg);
    color: var(--accent);
    font-size: .72rem;
    font-weight: 600;
    letter-spacing: .03em;
    text-transform: uppercase;
    padding: .15rem .5rem;
    border-radius: 999px;
    margin-right: .35rem;
  }
  .empty { color: var(--muted); font-style: italic; padding: .5rem 0; }
  .filters { display: flex; flex-wrap: wrap; gap: .4rem; margin: .5rem 0 1.5rem; }
  .filters label {
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: .3rem .7rem;
    font-size: .85rem;
    cursor: pointer;
    user-select: none;
  }
  .filters input { margin-right: .35rem; }
  .card-row { display: flex; gap: .9rem; align-items: flex-start; }
  .cover-link { flex: 0 0 auto; line-height: 0; }
  .cover { width: 64px; height: auto; border-radius: 4px; border: 1px solid var(--border); display: block; background: var(--accent-bg); }
  .cover-large { width: 140px; }
  .card-body { flex: 1 1 auto; min-width: 0; }
  .actions { margin-top: .55rem; }
  .tweet-btn {
    display: inline-flex;
    align-items: center;
    gap: .35rem;
    font-size: .78rem;
    font-weight: 600;
    color: var(--fg);
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: .3rem .65rem;
    text-decoration: none;
  }
  .tweet-btn:hover { border-color: var(--accent); color: var(--accent); }
  .tweet-btn svg { width: 12px; height: 12px; fill: currentColor; }
  .book-detail dl { display: grid; grid-template-columns: auto 1fr; gap: .3rem 1rem; font-size: .95rem; }
  .book-detail dt { color: var(--muted); }
  .back-link { display: inline-block; margin-bottom: 1rem; font-size: .9rem; }
</style>
</head>
<body>
<div class="wrap">
  <header class="site">
    <h1><a href="index.html" style="text-decoration:none;color:inherit;">{{ site_title }}</a></h1>
    <div class="tagline">Tracking new physiotherapy &amp; rehabilitation books, and new editions of the texts you already use.</div>
    <nav><a href="index.html">Home</a><a href="feed.xml">RSS</a><a href="feed.json">JSON Feed</a></nav>
  </header>
  {% block content %}{% endblock %}
  <footer class="site">
    Generated {{ generated_at }} &middot; {{ total_known }} books tracked in total &middot;
    <a href="https://github.com/" target="_blank" rel="noopener">source</a>
  </footer>
</div>
</body>
</html>
