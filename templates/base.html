<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site_title }}{% endblock %}</title>
<link rel="alternate" type="application/rss+xml" title="{{ site_title }}" href="feed.xml">
<link rel="alternate" type="application/json" title="{{ site_title }}" href="feed.json">
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfaf8;
    --fg: #1c1c1a;
    --muted: #6b6b63;
    --accent: #2f6f4f;
    --accent-bg: #e9f3ec;
    --border: #e3e1da;
    --card-bg: #ffffff;
    --edition-bg: #fff6e0;
    --edition-border: #e8c468;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a;
      --fg: #eceae4;
      --muted: #a3a196;
      --accent: #6fcf97;
      --accent-bg: #1e2b23;
      --border: #33342f;
      --card-bg: #1f2022;
      --edition-bg: #2b2410;
      --edition-border: #7a5f1f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.5 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  a { color: var(--accent); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 2rem 1.25rem 3rem; }

  header.site {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: .4rem 1rem;
    margin-bottom: 1.75rem;
  }
  header.site h1 { font-size: 1.25rem; margin: 0; }
  header.site h1 a { text-decoration: none; color: inherit; }
  header.site nav { font-size: .82rem; color: var(--muted); }
  header.site nav a { color: var(--muted); text-decoration: none; margin-left: .9rem; }
  header.site nav a:hover { color: var(--accent); }

  footer.site {
    margin-top: 2.5rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: .8rem;
  }
  footer.site a { color: var(--muted); }

  h2.section { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin: 2rem 0 .6rem; }
  .empty { color: var(--muted); font-size: .92rem; padding: .25rem 0; }

  /* Compact, borderless rows instead of boxed cards — a plain divider does
     the separating, so a long list stays calm rather than busy. */
  .row { display: flex; gap: .75rem; align-items: flex-start; padding: .7rem 0; border-bottom: 1px solid var(--border); }
  .row:last-child { border-bottom: none; }
  .row.edition { border-left: 3px solid var(--accent); padding-left: .65rem; }
  .row-cover { flex: 0 0 auto; line-height: 0; }
  .cover { width: 40px; height: auto; border-radius: 3px; display: block; background: var(--accent-bg); }
  .cover-large { width: 120px; }
  .row-body { flex: 1 1 auto; min-width: 0; }
  .row-body h3 { margin: 0; font-size: .98rem; font-weight: 600; line-height: 1.35; }
  .row-body h3 a { text-decoration: none; color: var(--fg); }
  .row-body h3 a:hover { color: var(--accent); }
  .row-meta { color: var(--muted); font-size: .82rem; margin-top: .15rem; }
  .row-tag { color: var(--accent); font-weight: 600; }

  .share-btn {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    color: var(--muted);
    text-decoration: none;
    align-self: center;
  }
  .share-btn:hover { color: var(--accent); background: var(--accent-bg); }
  .share-btn svg { width: 12px; height: 12px; fill: currentColor; }

  select.filter-select {
    font: inherit;
    font-size: .85rem;
    color: var(--fg);
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: .3rem .5rem;
    margin-bottom: .5rem;
  }

  .update-box { margin-bottom: 1.5rem; }
  .update-btn {
    display: inline-block;
    background: var(--accent);
    color: var(--bg);
    font-size: .95rem;
    font-weight: 600;
    text-decoration: none;
    padding: .55rem 1.15rem;
    border-radius: 8px;
  }
  .update-btn:hover { opacity: 0.9; }
  .update-help { color: var(--muted); font-size: .78rem; margin: .5rem 0 0; }

  .book-detail dl { display: grid; grid-template-columns: auto 1fr; gap: .3rem 1rem; font-size: .92rem; }
  .book-detail dt { color: var(--muted); }
  .back-link { display: inline-block; margin-bottom: 1rem; font-size: .85rem; color: var(--muted); text-decoration: none; }
  .back-link:hover { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header class="site">
    <h1><a href="index.html">{{ site_title }}</a></h1>
    <nav><a href="feed.xml">RSS</a><a href="feed.json">JSON</a></nav>
  </header>
  {% block content %}{% endblock %}
  <footer class="site">
    Updated {{ generated_at }} &middot; {{ total_known }} books tracked
    {% if github_repo %} &middot; <a href="https://github.com/{{ github_repo }}" target="_blank" rel="noopener">source</a>{% endif %}
  </footer>
</div>
</body>
</html>
