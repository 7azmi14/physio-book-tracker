# physio-book-tracker configuration
# Edit freely — no code changes needed for anything in this file.

# A book must match at least one include_keyword (in title, subtitle, subject
# fields, or description) to be considered at all.
include_keywords:
  - physiotherapy
  - physical therapy
  - rehabilitation
  - musculoskeletal
  - neurorehabilitation
  - manual therapy
  - exercise prescription
  - clinical reasoning
  - sports physiotherapy
  - cardiopulmonary rehabilitation
  # These subspecialty terms are deliberately short/loose rather than
  # compound phrases like "geriatric physiotherapy" — real titles almost
  # never use that exact phrasing ("Geriatric Rehabilitation for the
  # Physical Therapist Assistant" contains neither "geriatric
  # rehabilitation" nor "geriatric physiotherapy" as one phrase). Loose
  # single/short terms match how titles actually read; exclude_keywords
  # and the other, more specific terms above still gate out noise.
  - neurological physiotherapy
  - neuro rehabilitation
  - stroke rehabilitation
  - pediatric physiotherapy
  - paediatric
  - geriatric physiotherapy
  - geriatric rehabilitation
  - elderly
  - women's health physiotherapy
  - pelvic health
  - sports rehabilitation
  - sports medicine
  - athletic training

# A book matching any exclude_keyword is dropped even if it also matched an
# include_keyword above. Tune this list as you see noise in the digest.
exclude_keywords:
  - veterinary
  - equine
  - canine
  - feline
  - dental hygiene
  - nursing home administration
  # "rehabilitation" alone is too broad — these catch the two literal (not
  # clinical) senses that slipped through: infrastructure/road rehab, and
  # speech-language pathology (a distinct discipline from physiotherapy,
  # even though it also falls under the broader "rehabilitation" umbrella).
  - road rehabilitation
  - road maintenance
  - highway
  - pavement
  - infrastructure
  - communication disorders
  - language disorders
  - speech-language pathology
  # general psychological/psychiatric rehabilitation, as distinct from
  # "psychosocial elements of physical therapy"-type texts that are
  # actually about PT practice — this one's broad enough to risk false
  # positives, watch for that.
  - psychological intervention

# How many days back each source should query on every run. Keep this wider
# than the cron interval (~30 days for the monthly schedule) so a
# slow-to-index source, a delayed Actions run, or a month with 31 days
# doesn't cause a permanent gap — overlap is harmless because the state
# store dedupes.
lookback_days: 45

# Toggle sources on/off without deleting their code. "crossref" and
# "google_books" are implemented; "openlibrary" and "springer" are
# placeholders for a later build phase. Leave google_books off until you've
# checked its output quality the same way you did for CrossRef
# (python main.py --dry-run), same as the original build order.
sources:
  crossref:
    enabled: true
    # CrossRef asks polite-pool users to identify themselves with a contact
    # URL or email in the User-Agent and/or a mailto param — keeps you off
    # the low-priority pool. Fill in before running unattended.
    mailto: "alharbi.abd@outlook.com"
  google_books:
    # Enabled: this is the source that actually catches new editions of
    # reference texts — it queries each watchlist entry's title+author
    # directly, unlike CrossRef's keyword search, which misses classic
    # print textbooks (Kisner, Magee, O'Sullivan, Neumann...) because their
    # publishers don't reliably deposit DOI metadata for them. Keyless
    # access hit a shared global quota wall, so this now runs with a real
    # API key — stored as the GOOGLE_BOOKS_API_KEY GitHub Actions secret,
    # NOT here, since config.yaml is committed to the public repo. The
    # env var always wins over api_key below when both are set.
    enabled: true
    api_key: ""
  openlibrary:
    enabled: false
  springer:
    enabled: false

email:
  enabled: false
  recipients:
    - alharbi.abd@outlook.com
  # Sent via the Resend API (RESEND_API_KEY env var / GitHub Actions
  # secret — never put the key itself in this file). "onboarding@resend.dev"
  # is Resend's built-in test sender and works with no setup, but it can
  # only send to the email address on your Resend account. To send to
  # anyone else, verify your own domain in Resend and put an address on
  # that domain here instead, e.g. "Physio Book Tracker <digest@yourdomain.com>".
  from: "Physio Book Tracker <onboarding@resend.dev>"
  # If nothing new was found this run, send nothing at all rather than an
  # empty digest.
  send_empty_digest: false

site:
  title: "Physio Book Tracker"
  # Used for feed.xml / feed.json item links, RSS <link>, and the "View
  # full site" link in the email digest. The clean Cloudflare Pages URL —
  # GitHub Pages (https://7azmi14.github.io/physio-book-tracker) still
  # works too and gets the same content, this is just the one without a
  # personal username in it, which is what's meant to be shared.
  base_url: "https://physio-book-tracker.pages.dev"
  # owner/repo — powers the "Update Me" button on the site, which links
  # straight to this workflow's manual-run page on GitHub. Leave blank to
  # hide the button.
  github_repo: "7azmi14/physio-book-tracker"

# Relevance score (see core/scoring.py) below which an item is discarded
# entirely and never stored. Raise this if the digest is too noisy, lower it
# if it's missing things.
min_relevance_score: 2
